<div class="announcement" role="status">
    <div class="announcement__inner">
        NEW SEASON 2026 <span aria-hidden="true">·</span>
        MIỄN PHÍ GIAO HÀNG CHO ĐƠN TỪ 999.000₫
    </div>
</div>

<header class="site-header">
    <a class="brand" href="{% url 'home' %}" aria-label="QuangHuy Store - Trang chủ">QuangHuy Store</a>

    <nav class="main-nav" aria-label="Điều hướng chính">
        <a href="{% url 'home' %}?new=1">HÀNG MỚI</a>
        {% for category in menu_categories %}
        <a href="{% url 'product_by_category' category.slug %}">{{ category.name|upper }}</a>
        {% endfor %}
    </nav>

    <div class="utility-nav">
        <form class="header-search" action="{% url 'home' %}" method="get" role="search">
            <label class="sr-only" for="header-search-input">Tìm kiếm sản phẩm</label>
            <input id="header-search-input" name="q" value="{{ request.GET.q }}" placeholder="Tìm sản phẩm">
            <button type="submit" aria-label="Tìm kiếm">⌕</button>
        </form>
        <a class="utility-link" href="{% url 'login' %}" aria-label="Tài khoản">♙</a>
        <a class="utility-link cart-link" href="{% url 'home' %}#products" aria-label="Giỏ hàng">
            ♧<span class="cart-badge">{{ cart_count }}</span>
        </a>
    </div>
</header>
