{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{% block meta_description %}QuangHuy Store - Giày và quần áo bóng đá chính hãng.{% endblock %}">
    <title>{% block title %}QuangHuy Store{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'Login/css/base.css' %}">
    <link rel="stylesheet" href="{% static 'Login/css/header.css' %}?v=4">
    <link rel="stylesheet" href="{% static 'Login/css/footer.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% include 'header.html' %}

    <main>
        {% block content %}{% endblock %}
    </main>

    {% include 'footer.html' %}
    {% block extra_js %}{% endblock %}
</body>
</html>
