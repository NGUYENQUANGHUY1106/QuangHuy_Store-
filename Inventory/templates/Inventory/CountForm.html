{% extends 'AdminPanel/base_admin.html' %}{% load static %}{% block extra_css %}<link rel="stylesheet" href="{% static 'Inventory/css/form.css' %}">{% endblock %}{% block content %}<section><h1>Tạo phiếu kiểm kê</h1><form method="post">{% csrf_token %}{{ form.as_p }}{% for warehouse in warehouses %}<fieldset><legend>{{ warehouse.name }}</legend>{% for stock in warehouse.stocks.all %}<label>{{ stock.variant.sku }} (hệ thống {{ stock.on_hand }})<input type="number" min="0" name="stock_{{ stock.id }}"></label>{% endfor %}</fieldset>{% endfor %}<button>Tạo phiếu</button></form></section>{% endblock %}
