{% extends 'base.html' %}{% load static %}{% block title %}Tạo yêu cầu hỗ trợ{% endblock %}{% block extra_css %}<link rel="stylesheet" href="{% static 'Support/css/support-form.css' %}">{% endblock %}{% block content %}<section class="support-form"><h1>LIÊN HỆ HỖ TRỢ</h1>{% for message in messages %}<div>{{ message }}</div>{% endfor %}<form method="post" enctype="multipart/form-data">{% csrf_token %}<label>Danh mục<select name="category"><option>Đơn hàng</option><option>Đổi trả</option><option>Sản phẩm</option><option>Khác</option></select></label><label>Tiêu đề<input name="subject" minlength="5" required></label><label>Nội dung<textarea name="message" minlength="10" required></textarea></label><label>Ảnh/PDF tối đa 3 MB<input name="attachment" type="file" accept="image/jpeg,image/png,application/pdf"></label><button>GỬI YÊU CẦU</button></form></section>{% endblock %}
